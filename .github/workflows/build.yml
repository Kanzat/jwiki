# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-gradle

name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'temurin'
    - name: Setup Gradle (also validates the wrapper)
      uses: gradle/actions/setup-gradle@v6
    - name: Build
      run: ./gradlew build
    # GitHub Packages rejects re-publishing an existing version, so publishing runs only when the
    # workflow is started manually (Actions -> build -> Run workflow), after bumping `version` in build.gradle.
    - name: Publish to GitHub Packages
      if: github.event_name == 'workflow_dispatch'
      run: ./gradlew publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
